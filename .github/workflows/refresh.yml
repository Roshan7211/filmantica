# Keeps availability current.
#
# Licences begin and end continuously, so a "FREE" badge that is wrong is the one
# failure that would undermine this site. A full weekly refresh is not affordable
# — 1,064 titles against a 2,500 request monthly budget — so this refreshes the
# 500 titles checked longest ago and cycles. The whole catalogue comes round
# roughly fortnightly, spending about 2,000 requests a month and leaving headroom.
#
# Repository secrets:
#   WATCHMODE_API_KEY      the API key (required)
#   HOSTINGER_DEPLOY_HOOK  Hostinger's redeploy webhook URL, for filmantica.com.
#                          Not needed if Hostinger already redeploys on every push.
#   VERCEL_DEPLOY_HOOK     a Vercel deploy hook URL, because pushing to GitHub does
#                          not currently trigger a deploy on that project
name: Refresh availability

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Titles to refresh (1 request each)"
        default: "500"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A normal run takes ~5 minutes. Without this, a hung run held the job for
    # GitHub's 6-hour maximum, four weeks running, and committed nothing.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the API is reachable and has quota
        env:
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
        run: |
          if [ -z "$WATCHMODE_API_KEY" ]; then
            echo "WATCHMODE_API_KEY secret is not set - add it in Settings > Secrets."
            exit 1
          fi
          curl -s "https://api.watchmode.com/v1/status/?apiKey=$WATCHMODE_API_KEY"
          echo

      - name: Refresh availability
        env:
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          DISCOVERY_REGION: IN
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            scripts/refresh-availability.mjs --limit "${{ inputs.limit || '500' }}"

      - name: Commit if availability changed
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "no availability changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "filmantica-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "chore: refresh availability"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the refreshed data
        if: steps.commit.outputs.changed == 'true'
        env:
          HOSTINGER_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOSTINGER_HOOK$VERCEL_HOOK" ]; then
            echo "::warning::No deploy hook is set - data was committed but only a push-triggered deploy will pick it up."
            exit 0
          fi
          if [ -n "$HOSTINGER_HOOK" ]; then
            curl -sS -X POST "$HOSTINGER_HOOK" -o /dev/null -w "hostinger hook: %{http_code}\n"
          fi
          if [ -n "$VERCEL_HOOK" ]; then
            curl -sS -X POST "$VERCEL_HOOK" -o /dev/null -w "vercel hook: %{http_code}\n"
          fi
