# Runs the catalogue importer on GitHub's network, which can reach archive.org,
# and commits the refreshed catalogue back to the repo. Vercel redeploys on that push.
name: Import catalogue

on:
  schedule:
    - cron: "0 4 * * 0"      # Sundays, 04:00 UTC
  workflow_dispatch:          # or run it on demand from the Actions tab
    inputs:
      rows:
        description: "Items per page"
        default: "100"
      pages:
        description: "Pages per strategy"
        default: "5"
      strategy:
        description: "Limit to one strategy (cc | curated), blank for both"
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit the refreshed catalogue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm archive.org is reachable
        run: curl -sI -m 20 https://archive.org/advancedsearch.php | head -1

      - name: Run importer
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/import.mjs \
            --rows "${{ inputs.rows || '100' }}" \
            --pages "${{ inputs.pages || '5' }}" \
            ${{ inputs.strategy && format('--strategy {0}', inputs.strategy) || '' }}

      - name: Commit if the catalogue changed
        run: |
          if git diff --quiet -- data/; then
            echo "no catalogue changes"
            exit 0
          fi
          git config user.name  "filmantica-importer"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "chore: refresh catalogue from Internet Archive"
          git push
